# =====================================================
# Notification Service Configuration
# =====================================================

# -----------------------------------------------------
# Server Configuration
# -----------------------------------------------------
server.port=8080
spring.application.name=notification-service

# -----------------------------------------------------
# Kafka Consumer Configuration
# -----------------------------------------------------
spring.kafka.bootstrap-servers=skafka:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Topic
app.kafka.topic.notification-result=results

# Enable real Kafka consumer (set to true for production)
app.kafka.enabled=true

# -----------------------------------------------------
# Apache Ignite Configuration
# -----------------------------------------------------
# Set to true to connect to real Ignite cluster, false for simulated (in-memory) cache
app.ignite.enabled=true
app.ignite.addresses=localhost:10800
app.ignite.cluster-name=osw-cluster
app.ignite.key-prefix=ns

# Cache: Subscription Routing (v2 uses long timestamp instead of Instant)
app.ignite.cache.subscription-routing.name=subscription-routing-v2
app.ignite.cache.subscription-routing.backups=1
app.ignite.cache.subscription-routing.expiry-seconds=300

# Cache: Notification Log
app.ignite.cache.notification-log.name=notification-logs
app.ignite.cache.notification-log.backups=1
app.ignite.cache.notification-log.expiry-seconds=600

# Ignite Messaging Topic (Cross-node communication)
app.ignite.messaging.topic=ns-notifications

# Cache: Node Registry
app.ignite.cache.node-registry.name=ns-nodes
app.ignite.cache.node-registry.backups=2

# -----------------------------------------------------
# gRPC Configuration (Inter-Node Communication)
# -----------------------------------------------------
# Enable gRPC Server
app.grpc.enabled=true
app.grpc.port=9090

# Node Identity (auto-generated if not set)
# app.node.id=${HOSTNAME:localhost}

# Heartbeat
app.node.heartbeat.interval-ms=10000
app.node.heartbeat.timeout-ms=30000
app.node.heartbeat.offline-ms=60000

# gRPC Client
app.grpc.client.timeout-ms=5000
app.grpc.client.retry-count=2
app.grpc.client.retry-delay-ms=500
app.grpc.client.pool-size=10
app.grpc.client.idle-timeout-ms=300000

# -----------------------------------------------------
# WebSocket Configuration
# -----------------------------------------------------
app.websocket.path=/ws/notifications
app.websocket.max-connections=10000
app.websocket.idle-timeout-seconds=60

# -----------------------------------------------------
# Business Logic Configuration
# -----------------------------------------------------
# Subscription timeout (client must connect within this period)
app.subscription.timeout-seconds=30

# Notification retry
app.notification.max-retries=3
app.notification.retry-delay-ms=1000

# -----------------------------------------------------
# Actuator / Health Check
# -----------------------------------------------------
management.endpoints.web.exposure.include=health,ready,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.kafka.enabled=true

# -----------------------------------------------------
# Logging
# -----------------------------------------------------
logging.level.root=INFO
logging.level.com.nhi.notification=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.apache.ignite=WARN

# -----------------------------------------------------
# Virtual Threads (Java 21)
# -----------------------------------------------------
spring.threads.virtual.enabled=true